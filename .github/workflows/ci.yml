name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (.NET 8.0)
    runs-on: windows-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore NetWard.sln

      - name: Build Solution
        run: dotnet build NetWard.sln --no-restore --configuration Release

      - name: Run Unit & Simulation Tests
        run: dotnet test tests/NetWard.Tests/NetWard.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Publish CLI Artifact
        run: dotnet publish src/NetWard.Cli/NetWard.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/cli

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netward-cli-win-x64
          path: dist/cli/NetWard.Cli.exe
