<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0E11"/>
      <stop offset="50%" stop-color="#16181D"/>
      <stop offset="100%" stop-color="#0D0E11"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F298"/>
      <stop offset="100%" stop-color="#00A86B"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle Tactical Grid Pattern -->
  <g stroke="#1D2027" stroke-width="1" opacity="0.6">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Left Icon Area -->
  <g transform="translate(100, 60)">
    <!-- Base Shield -->
    <path d="M140 20 L240 65 V170 C240 240 185 285 140 305 C95 285 40 240 40 170 V65 Z" 
          fill="#16181D" stroke="url(#shieldGrad)" stroke-width="8" stroke-linejoin="round"/>
    <!-- Pulse Line -->
    <path d="M70 165 H110 L125 115 L145 215 L160 145 L175 180 L185 165 H210" 
          fill="none" stroke="#00F298" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography & Copy -->
  <g transform="translate(420, 140)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#F3F4F6" letter-spacing="2">NETWARD</text>
    <rect x="330" y="-48" width="76" height="28" rx="6" fill="#1D2027" stroke="#2A2E39" stroke-width="1"/>
    <text x="368" y="-30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#00F298" text-anchor="middle">v1.0.0</text>
    
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#00F298">Internet Resilience &amp; Diagnostics Companion</text>
    
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9CA3AF">
      Честная многоуровневая диагностика доступности сервисов и игровых серверов для молодежи
    </text>

    <!-- Tactical Status Pills -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1D2027" stroke="#2A2E39" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#00E599"/>
      <text x="75" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#F3F4F6" text-anchor="middle">100% Local-First</text>

      <rect x="150" y="0" width="115" height="28" rx="6" fill="#1D2027" stroke="#2A2E39" stroke-width="1"/>
      <circle cx="166" cy="14" r="4" fill="#00E599"/>
      <text x="212" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#F3F4F6" text-anchor="middle">Zero Tracking</text>

      <rect x="280" y="0" width="105" height="28" rx="6" fill="#1D2027" stroke="#2A2E39" stroke-width="1"/>
      <circle cx="296" cy="14" r="4" fill="#00E599"/>
      <text x="338" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#F3F4F6" text-anchor="middle">Apache-2.0</text>
    </g>
  </g>
</svg>
