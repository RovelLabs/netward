<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181D"/>
      <stop offset="100%" stop-color="#0D0E11"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F298"/>
      <stop offset="100%" stop-color="#00A86B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#2A2E39" stroke-width="8"/>
  
  <!-- Outer Tactical Hex / Shield Boundary -->
  <path d="M256 64 L416 128 V272 C416 368 336 432 256 464 C176 432 96 368 96 272 V128 Z" 
        fill="#1D2027" stroke="#3E4453" stroke-width="12" stroke-linejoin="round"/>

  <!-- Inner Glowing Shield -->
  <path d="M256 96 L384 148 V264 C384 340 320 396 256 424 C192 396 128 340 128 264 V148 Z" 
        fill="#16181D" stroke="url(#shieldGrad)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Tactical Pulse Wave (Heartbeat of Network) -->
  <path d="M160 264 H216 L236 200 L260 328 L284 240 L300 280 L316 264 H352" 
        fill="none" stroke="#00F298" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Radar Focus Dot -->
  <circle cx="256" cy="264" r="6" fill="#FFFFFF"/>
</svg>
