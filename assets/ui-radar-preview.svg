<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="windowBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0E11"/>
      <stop offset="100%" stop-color="#14161C"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Window Container -->
  <rect x="20" y="20" width="960" height="480" rx="16" fill="url(#windowBg2)" stroke="#2A2E39" stroke-width="2" filter="url(#shadow2)"/>

  <!-- Header -->
  <rect x="20" y="20" width="960" height="50" rx="16" fill="#16181D"/>
  <rect x="20" y="50" width="960" height="20" fill="#16181D"/>
  <text x="50" y="48" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#00E599">🎯 ИГРОВОЙ РАДАР (GAMING LATENCY RADAR)</text>
  <text x="50" y="78" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" fill="#9CA3AF">Измерение многопакетного пинга, джиттера и потерь пакетов до серверов онлайн-игр</text>

  <!-- Row 1: CS2 Warsaw -->
  <g transform="translate(50, 100)">
    <rect width="900" height="75" rx="10" fill="#16181D" stroke="#2A2E39" stroke-width="1"/>
    <text x="24" y="34" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#F3F4F6">Counter-Strike 2</text>
    <text x="24" y="54" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" fill="#9CA3AF">EU East (Warsaw, Poland)</text>

    <!-- Ping Column -->
    <text x="460" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#9CA3AF">СРЕДНИЙ ПИНГ</text>
    <text x="460" y="54" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#00E599">28 ms</text>

    <!-- Jitter Column -->
    <text x="600" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#9CA3AF">ДЖИТТЕР</text>
    <text x="600" y="54" font-family="Consolas, monospace" font-size="16" fill="#F3F4F6">±1.2 ms</text>

    <!-- Loss Column -->
    <text x="740" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#9CA3AF">ПОТЕРИ</text>
    <text x="740" y="54" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#00E599">0%</text>

    <circle cx="860" cy="38" r="8" fill="#00E599"/>
  </g>

  <!-- Row 2: Dota 2 Stockholm -->
  <g transform="translate(50, 190)">
    <rect width="900" height="75" rx="10" fill="#16181D" stroke="#2A2E39" stroke-width="1"/>
    <text x="24" y="34" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#F3F4F6">Dota 2</text>
    <text x="24" y="54" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" fill="#9CA3AF">Stockholm Core (Sweden)</text>

    <text x="460" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#9CA3AF">СРЕДНИЙ ПИНГ</text>
    <text x="460" y="54" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#00E599">34 ms</text>

    <text x="600" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#9CA3AF">ДЖИТТЕР</text>
    <text x="600" y="54" font-family="Consolas, monospace" font-size="16" fill="#F3F4F6">±2.4 ms</text>

    <text x="740" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#9CA3AF">ПОТЕРИ</text>
    <text x="740" y="54" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#00E599">0%</text>

    <circle cx="860" cy="38" r="8" fill="#00E599"/>
  </g>

  <!-- Row 3: Roblox EU Gateway -->
  <g transform="translate(50, 280)">
    <rect width="900" height="75" rx="10" fill="#16181D" stroke="#2A2E39" stroke-width="1"/>
    <text x="24" y="34" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#F3F4F6">Roblox</text>
    <text x="24" y="54" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" fill="#9CA3AF">Europe Gateway</text>

    <text x="460" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#9CA3AF">СРЕДНИЙ ПИНГ</text>
    <text x="460" y="54" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#00E599">42 ms</text>

    <text x="600" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#9CA3AF">ДЖИТТЕР</text>
    <text x="600" y="54" font-family="Consolas, monospace" font-size="16" fill="#F3F4F6">±3.1 ms</text>

    <text x="740" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#9CA3AF">ПОТЕРИ</text>
    <text x="740" y="54" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#00E599">0%</text>

    <circle cx="860" cy="38" r="8" fill="#00E599"/>
  </g>

  <!-- Row 4: Minecraft Hypixel -->
  <g transform="translate(50, 370)">
    <rect width="900" height="75" rx="10" fill="#16181D" stroke="#2A2E39" stroke-width="1"/>
    <text x="24" y="34" font-family="-apple-system, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#F3F4F6">Minecraft</text>
    <text x="24" y="54" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" fill="#9CA3AF">Hypixel Network</text>

    <text x="460" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#9CA3AF">СРЕДНИЙ ПИНГ</text>
    <text x="460" y="54" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#FFB300">88 ms</text>

    <text x="600" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#9CA3AF">ДЖИТТЕР</text>
    <text x="600" y="54" font-family="Consolas, monospace" font-size="16" fill="#F3F4F6">±14.2 ms</text>

    <text x="740" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#9CA3AF">ПОТЕРИ</text>
    <text x="740" y="54" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#00E599">0%</text>

    <circle cx="860" cy="38" r="8" fill="#FFB300"/>
  </g>
</svg>
